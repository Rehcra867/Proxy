<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kiwi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --kiwi: #30ff00; --kiwi-dim: #1ecc00; }
    body { background: #050d05; color: #fff; font-family: 'Inter', system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #stars-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    #nav { position: relative; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 52px; background: #000; border-bottom: 1px solid rgba(48,255,0,.12); flex-shrink: 0; }
    .nav-btn { background: none; border: none; color: rgba(255,255,255,.45); cursor: pointer; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, color .15s; }
    .nav-btn:hover { background: rgba(255,255,255,.08); color: var(--kiwi); }
    .nav-btn:disabled { opacity: .25; cursor: default; }
    .nav-btn svg { width: 16px; height: 16px; }
    #bar-wrap { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 0 12px; height: 36px; gap: 8px; transition: border-color .15s, box-shadow .15s; position: relative; }
    #bar-wrap:focus-within { border-color: var(--kiwi); box-shadow: 0 0 0 3px rgba(48,255,0,.12); }
    #url-bar { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 13.5px; font-family: 'Inter', system-ui, sans-serif; caret-color: var(--kiwi); }
    #url-bar::placeholder { color: rgba(255,255,255,.3); }
    #go-btn { background: var(--kiwi); color: #061006; border: none; border-radius: 7px; padding: 0 16px; height: 30px; font-size: 13px; font-weight: 700; font-family: 'Inter', system-ui, sans-serif; cursor: pointer; flex-shrink: 0; transition: background .15s, box-shadow .15s; }
    #go-btn:hover { background: #4dff26; box-shadow: 0 0 14px rgba(48,255,0,.4); }
    #frame-wrap { flex: 1; position: relative; z-index: 1; overflow: hidden; }
    #proxy-frame { width: 100%; height: 100%; border: none; }
    #load-bar { position: absolute; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--kiwi-dim), var(--kiwi)); box-shadow: 0 0 10px var(--kiwi); width: 0%; z-index: 5; pointer-events: none; }
    #start-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 4; }
    #start-screen.hidden { display: none; }
    #hero-glow { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 520px; height: 520px; background: radial-gradient(circle, rgba(48,255,0,.22) 0%, rgba(48,255,0,.06) 40%, transparent 70%); pointer-events: none; z-index: 0; }
    #hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #hero-content h2 { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -.02em; text-shadow: 0 0 30px rgba(48,255,0,.4); }
    #hero-content p { color: rgba(255,255,255,.45); font-size: 14px; text-align: center; line-height: 1.65; }
    #sw-status { font-size: 12px; color: rgba(255,255,255,.25); margin-top: -4px; }
    #sw-status.ready { color: var(--kiwi); }
    #sw-status.error { color: #f87171; }
  </style>
</head>
<body>
  <canvas id="stars-canvas"></canvas>
  <div id="nav">
    <button class="nav-btn" id="btn-home" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <div style="width:1px;height:22px;background:rgba(255,255,255,.12);flex-shrink:0;margin:0 2px;"></div>
    <button class="nav-btn" id="btn-back" title="Back" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" id="btn-fwd" title="Forward" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="nav-btn" id="btn-reload" title="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
    </button>
    <div id="bar-wrap">
      <input id="url-bar" type="text" placeholder="search or enter a url..." autocomplete="off" spellcheck="false" />
    </div>
    <button id="go-btn">go</button>
  </div>
  <div id="frame-wrap">
    <div id="load-bar"></div>
    <div id="start-screen">
      <div id="hero-glow"></div>
      <div id="hero-content">
        <h2>kiwi unblocker</h2>
        <p>type anything to search, or paste a url to browse it privately.</p>
        <div id="sw-status">registering service worker...</div>
      </div>
    </div>
    <iframe id="proxy-frame" allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad"></iframe>
  </div>

  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>

  <script>
  (function () {
    var canvas = document.getElementById('stars-canvas');
    var ctx = canvas.getContext('2d');
    var stars = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function initStars() {
      stars = [];
      var count = Math.floor((canvas.width * canvas.height) / 6000);
      for (var i = 0; i < count; i++) {
        stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.2 + 0.2, o: Math.random() * 0.6 + 0.1, speed: Math.random() * 0.003 + 0.001, phase: Math.random() * Math.PI * 2 });
      }
    }
    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200,255,180,' + (s.o * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase))) + ')';
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize(); initStars();
    window.addEventListener('resize', function () { resize(); initStars(); });
    requestAnimationFrame(draw);
  })();
  </script>

  <script>
  (function () {
    var bar = document.getElementById('url-bar');
    var frame = document.getElementById('proxy-frame');
    var loadBar = document.getElementById('load-bar');
    var start = document.getElementById('start-screen');
    var swStatus = document.getElementById('sw-status');
    var btnBack = document.getElementById('btn-back');
    var btnFwd = document.getElementById('btn-fwd');
    var hist = [], hIdx = -1, swReady = false;

    async function registerSW() {
      try {
        await BareMux.setTransport("/epoxy/");
        var reg = await navigator.serviceWorker.register("/uv/sw.js", { scope: __uv$config.prefix });
        await new Promise(function (resolve) {
          if (reg.active) return resolve();
          var sw = reg.installing || reg.waiting;
          if (!sw) return resolve();
          sw.addEventListener("statechange", function () { if (sw.state === "activated") resolve(); });
        });
        swReady = true;
        swStatus.textContent = '';
        swStatus.className = 'ready';
      } catch (e) {
        swStatus.textContent = 'setup failed: ' + e.message;
        swStatus.className = 'error';
      }
    }
    registerSW();

    function isUrl(s) {
      if (/^https?:\/\//i.test(s)) return true;
      if (/^[a-z0-9-]+(\.[a-z]{2,})+/i.test(s) && !s.includes(' ')) return true;
      return false;
    }

    function toProxied(raw) {
      raw = raw.trim();
      if (!raw) return null;
      var target;
      if (/^https?:\/\//i.test(raw)) target = raw;
      else if (isUrl(raw)) target = 'https://' + raw;
      else target = 'https://duckduckgo.com/?q=' + encodeURIComponent(raw);
      return __uv$config.prefix + __uv$config.encodeUrl(target);
    }

    function animLoad(restart) {
      loadBar.style.transition = 'none';
      if (restart) loadBar.style.width = '0%';
      void loadBar.offsetWidth;
      loadBar.style.transition = 'width 1.8s ease';
      loadBar.style.width = '85%';
    }
    function finishLoad() {
      loadBar.style.transition = 'width .2s ease';
      loadBar.style.width = '100%';
      setTimeout(function () { loadBar.style.transition = 'width .4s ease'; loadBar.style.width = '0%'; }, 350);
    }

    function navigate(proxiedPath, displayUrl, push) {
      if (!proxiedPath) return;
      start.classList.add('hidden');
      animLoad(true);
      frame.src = proxiedPath;
      if (displayUrl) bar.value = displayUrl;
      if (push !== false) {
        hist = hist.slice(0, hIdx + 1);
        hist.push({ proxy: proxiedPath, display: displayUrl || proxiedPath });
        hIdx = hist.length - 1;
      }
      updateNav();
    }

    function updateNav() {
      btnBack.disabled = hIdx <= 0;
      btnFwd.disabled = hIdx >= hist.length - 1;
    }

    frame.addEventListener('load', function () {
      finishLoad();
      try {
        var loc = frame.contentWindow.location.href;
        if (!loc || loc === 'about:blank') return;
        var display = loc;
        try {
          var prefix = __uv$config.prefix;
          if (loc.includes(prefix)) {
            var encoded = loc.slice(loc.indexOf(prefix) + prefix.length);
            display = __uv$config.decodeUrl(encoded);
          }
        } catch(e) {}
        hist = hist.slice(0, hIdx + 1);
        hist.push({ proxy: loc, display: display });
        hIdx = hist.length - 1;
        bar.value = display;
        updateNav();
      } catch(e) {}
    });

    function go() {
      var raw = bar.value.trim();
      if (!raw) return;
      var proxied = toProxied(raw);
      var display = isUrl(raw) ? (/^https?:\/\//i.test(raw) ? raw : 'https://' + raw) : raw;
      navigate(proxied, display);
      bar.blur();
    }

    document.getElementById('go-btn').addEventListener('click', go);
    bar.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    btnBack.addEventListener('click', function () { if (hIdx > 0) { hIdx--; var e = hist[hIdx]; navigate(e.proxy, e.display, false); } });
    btnFwd.addEventListener('click', function () { if (hIdx < hist.length - 1) { hIdx++; var e = hist[hIdx]; navigate(e.proxy, e.display, false); } });
    document.getElementById('btn-reload').addEventListener('click', function () {
      if (frame.src && frame.src !== 'about:blank') { animLoad(true); frame.contentWindow.location.reload(); }
    });
    document.getElementById('btn-home').addEventListener('click', function () { hist = []; hIdx = -1; start.classList.remove('hidden'); bar.value = ''; frame.src = 'about:blank'; updateNav(); });
    document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'l') { e.preventDefault(); bar.focus(); bar.select(); } });
  })();
  </script>
</body>
</html>
